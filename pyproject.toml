[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-sentry-ops"
version = "1.0.0"
description = "Sub-100ms Autonomous AWS Cloud Operations & Security Agent with Strands Decider 2B and Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chiranjibee Panigrahi" }
]
keywords = [
    "aws",
    "strands",
    "strands-decider-2b",
    "guardrails",
    "tool-selection",
    "model-routing",
    "amazon-bedrock",
    "cloud-ops",
    "sre"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "boto3>=1.35.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
sentry-ops = "cli:main"

[tool.setuptools.packages.find]
include = ["decider_patterns*", "agent*", "benchmarks*", "server*"]
